<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/mobile-bar.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Marcos Sanchez" />
    <meta name="description" content="A FlashCard study system" />
    <meta name="keywords" content="Flashcards, study, education" />

    <title>FlashCards</title>
  </head>

  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="#home" class="header__link">Flashcards</a>
      </h1>

      <nav class="nav">
        <ul class="nav__links">
          <li>
            <a href="#home" class="nav__link">My Decks</a>
          </li>

          <li>
            <a href="#about" class="nav__link">About</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content">
      <!-- HOME -->
      <section class="decks" id="home">
        <h2 class="decks__title">My Decks</h2>

        <div class="wrapping-row">
          <ul class="decks__list wrapping-row__display-contents"></ul>

          <template id="deck-template">
            <li class="deck deck_color_green">
              <a class="deck__link" href="#"></a>

              <h3 class="deck__title"></h3>

              <div class="deck__row">
                <p class="deck__count"></p>

                <button
                  class="deck__delete-btn"
                  type="button"
                  aria-label="Delete deck"
                ></button>
              </div>
            </li>
          </template>

          <button class="decks__new-deck-btn" type="button">
            + New Deck
          </button>
        </div>
      </section>

      <!-- DECK OPEN VIEW -->
      <section
        class="deck-view"
        id="deck-view"
        style="display: none"
      >
        <h2 class="deck-view__title"></h2>

        <ul class="deck-view__cards"></ul>

        <template id="card-template">
          <li class="deck-view__card">
            <p class="deck-view__card-text"></p>

            <button
              class="deck-view__delete-btn"
              type="button"
              aria-label="Delete card"
            ></button>
          </li>
        </template>

        <div class="deck-view__actions">
          <button
            class="deck-view__new-card-btn"
            type="button"
          >
            + New Card
          </button>

          <a class="deck-view__practice-btn" href="#">
            Practice
          </a>
        </div>
      </section>

      <!-- CAROUSEL -->
      <section
        class="carousel"
        id="carousel"
        style="display: none"
      >
        <h2 class="carousel__title"></h2>

        <div class="carousel__grid">
          <button
            class="carousel__btn carousel__btn_type_left"
            type="button"
            aria-label="Previous card"
          ></button>

          <div class="carousel__card">
            <p class="carousel__card-text"></p>
          </div>

          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next card"
          ></button>

          <button
            class="carousel__btn carousel__btn_type_flip"
            type="button"
            aria-label="Flip card"
          ></button>
        </div>
      </section>

      <!-- 404 -->
      <section id="not-found" style="display: none">
        <h2>404</h2>
        <p>Page not found.</p>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">Marcos Sanchez</p>
    </footer>

    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
